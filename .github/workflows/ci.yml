name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supervisor:
    name: supervisor (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r supervisor/requirements-dev.txt
      - name: Tests (offline, no tokens)
        run: python -m pytest supervisor/tests -q
      - name: Example scenario end to end
        run: python examples/acme/make_sample.py

  slack-agent:
    name: slack-agent (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: slack-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - name: Tests (offline, fake connectors, no tokens)
        run: npm test
        env:
          CONNECTORS: fake
          TRANSPORT: console

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f slack-agent/docker-compose.yml config --quiet
